# nginx перед EventMaster: HTTPS + проксирование WebSocket'ов (Socket.IO)
# кладём в /etc/nginx/sites-available/eventmaster и включаем симлинком в sites-enabled

server {
    listen 80;
    server_name _;

    # Socket.IO НЕ должен попадать под долгие буферы — проксируем как есть
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # без этих двух заголовков WebSocket-апгрейд не пройдёт
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # долгоживущие соединения: не рвём по таймаутам по умолчанию
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# после выпуска сертификата (sudo certbot --nginx) certbot сам допишет
# listen 443 ssl и редирект с 80-го порта
